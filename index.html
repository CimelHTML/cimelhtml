<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMEL.DOWN — Pinterest Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --merah: #ff1a1a;
            --merah-gelap: #cc0000;
            --hitam: #050505;
            --abu-1: #111;
            --abu-2: #222;
            --abu-3: #333;
            --teks-abu: #aaa;
            --putih: #fff;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a, #000);
            color: var(--putih);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .box {
            background: var(--abu-1);
            border: 1px solid var(--abu-2);
            padding: 35px 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(255, 26, 26, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 26, 26, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        h1 {
            color: var(--merah);
            letter-spacing: 3px;
            font-size: 28px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 26, 26, 0.4);
        }

        .sub {
            color: var(--teks-abu);
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--abu-3);
            background: #000;
            color: var(--putih);
            margin: 10px 0 20px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: var(--merah);
            box-shadow: 0 0 0 3px rgba(255, 26, 26, 0.15);
        }

        input::placeholder {
            color: #666;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--merah-gelap), var(--merah));
            color: var(--putih);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 26, 26, 0.25);
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(255, 26, 26, 0.35);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .hasil {
            margin-top: 20px;
            color: var(--teks-abu);
            font-size: 14px;
            line-height: 1.6;
            min-height: 40px;
        }

        .link-download {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 20px;
            background: rgba(255, 26, 26, 0.1);
            color: var(--merah);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .link-download:hover {
            background: rgba(255, 26, 26, 0.2);
            transform: scale(1.02);
        }

        .loading {
            color: #ff6b6b;
        }

        .error {
            color: #ff6b6b;
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>⚡ CIMEL.DOWN</h1>
        <p class="sub">Pinterest Video & Image Downloader<br>Fast • Clean • Free</p>
        
        <input id="url" type="url" placeholder="Tempel link Pinterest di sini..." autocomplete="off">
        <button id="btnDownload" onclick="go()">MULAI DOWNLOAD</button>
        
        <div id="hasil" class="hasil"></div>
        
        <p class="footer">dibuat khusus untuk cimel 🖤❤️</p>
    </div>

    <script>
        async function go() {
            const u = document.getElementById('url').value.trim();
            const hasilEl = document.getElementById('hasil');
            const btn = document.getElementById('btnDownload');

            if (!u) {
                hasilEl.innerHTML = '<span class="error">⚠️ Tempel link dulu dong Cimel! 😊</span>';
                document.getElementById('url').focus();
                return;
            }

            // Validasi sederhana
            if (!u.includes('pinterest')) {
                hasilEl.innerHTML = '<span class="error">❌ Harap masukkan link Pinterest yang valid!</span>';
                return;
            }

            // Loading state
            btn.disabled = true;
            btn.textContent = '⏳ Memproses...';
            hasilEl.innerHTML = '<span class="loading">🔄 Mengambil video dari: <br><small>' + u + '</small></span>';

            try {
                // Sambung ke API nanti
                const res = await fetch('/api/deploy?url=' + encodeURIComponent(u));
                
                if (!res.ok) throw new Error('Server tidak merespons');
                
                const d = await res.json();
                
                if (d.url) {
                    hasilEl.innerHTML = `
                        ✅ Siap diunduh! 🎉<br>
                        <a href="${d.url}" class="link-download" target="_blank">⬇️ KLIK DISINI</a>
                    `;
                } else {
                    throw new Error('Link tidak ditemukan');
                }
            } catch (err) {
                hasilEl.innerHTML = `
                    <span class="error">
                        ⚙️ Sistem sedang dalam pengembangan<br>
                        Design sudah siap, API menyusul ya Cimel 💪<br>
                        <small style="color:#555">${err.message || ''}</small>
                    </span>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = 'MULAI DOWNLOAD';
            }
        }

        // Enter langsung kirim
        document.getElementById('url').addEventListener('keydown', e => {
            if (e.key === 'Enter') go();
        });
    </script>
</body>
</html>
