<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIMEL.DOWN</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Courier New', monospace;
}
:root {
  --merah: #ff0000;
  --hitam: #000;
  --abu-gelap: #0a0a0a;
  --abu-batas: #222;
  --abu-teks: #888;
  --abu-lembut: #444;
  --putih: #fff;
}
body{
  background: var(--hitam);
  color: var(--putih);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container{
  width: 100%;
  max-width: 420px;
  border: 2px solid var(--merah);
  padding: 24px;
  background: var(--hitam);
  box-shadow: 0 0 20px rgba(255,0,0,0.3),
              inset 0 0 10px rgba(255,0,0,0.1);
  border-radius: 4px;
}
.header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.logo{
  font-weight: 900;
  letter-spacing: 2px;
  font-size: 18px;
}
.logo span{
  color: var(--merah);
}
.badge{
  border: 1px solid var(--merah);
  color: var(--merah);
  font-size: 9px;
  padding: 3px 8px;
  letter-spacing: 1px;
}
h1{
  font-size: 22px;
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 4px;
}
h1 span{
  color: var(--merah);
}
.desc{
  font-size: 11px;
  color: var(--abu-teks);
  margin: 12px 0 20px;
  line-height: 1.5;
}
.input-box{
  border: 1px solid var(--abu-batas);
  background: var(--abu-gelap);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.input-box:focus-within{
  border-color: var(--merah);
  box-shadow: 0 0 0 2px rgba(255,0,0,0.15);
}
.input-box input{
  flex: 1;
  background: transparent;
  border: none;
  color: var(--putih);
  outline: none;
  font-size: 13px;
  width: 100%;
}
.input-box input::placeholder{
  color: #555;
}
.btn{
  width: 100%;
  background: var(--merah);
  color: var(--putih);
  border: none;
  padding: 14px;
  font-weight: 900;
  letter-spacing: 1px;
  margin-top: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn:hover{
  background: #e60000;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(255,0,0,0.3);
}
.btn:active{
  transform: translateY(0);
}
.btn:disabled{
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}
.result{
  margin-top: 15px;
  display: none;
  border: 1px solid var(--merah);
  padding: 14px;
  background: rgba(255,0,0,0.03);
  word-break: break-all;
}
.result a{
  color: var(--merah);
  font-size: 13px;
  text-decoration: none;
}
.result a:hover{
  text-decoration: underline;
}
.result img{
  border-radius: 2px;
}
.status-loading{
  color: #ff9999;
}
.status-sukses{
  color: #ff6666;
  font-weight: bold;
}
.status-error{
  color: #ff4444;
}
.footer{
  margin-top: 20px;
  text-align: center;
  font-size: 9px;
  color: var(--abu-lembut);
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">⚡ CIMEL<span>.DOWN</span></div>
    <div class="badge">V1.1 ONLINE</div>
  </div>

  <h1>DOWNLOAD<br><span>PINTEREST</span><br>VIDEO & GAMBAR</h1>
  <p class="desc">Tempel link Pinterest → langsung download HD tanpa watermark<br>Dibuat khusus untuk cimel 🖤❤️</p>

  <div class="input-box">
    <input id="url" type="url" placeholder="https://www.pinterest.com/pin/..." autocomplete="off">
  </div>

  <button class="btn" id="btn" onclick="downloadReal()">MULAI DOWNLOAD</button>

  <div class="result" id="result"></div>

  <div class="footer">cimelcuy.vercel.app — 2025</div>
</div>

<script>
async function downloadReal(){
  const url = document.getElementById('url').value.trim();
  const resDiv = document.getElementById('result');
  const btn = document.getElementById('btn');

  // Validasi kosong
  if (!url) {
    resDiv.style.display = 'block';
    resDiv.innerHTML = '<span class="status-error">⚠️ Tempel link dulu Cimel! 😊</span>';
    document.getElementById('url').focus();
    return;
  }

  // Validasi link Pinterest
  if (!url.includes('pinterest.com') && !url.includes('pin.it')) {
    resDiv.style.display = 'block';
    resDiv.innerHTML = '<span class="status-error">❌ Masukkan link Pinterest yang valid ya!</span>';
    return;
  }

  // Mulai proses
  btn.disabled = true;
  btn.innerText = 'PROSES...';
  resDiv.style.display = 'block';
  resDiv.innerHTML = '<span class="status-loading">🔄 Lagi ambil data dari Pinterest... Tunggu sebentar ya ⏳</span>';

  try {
    const api = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const r = await fetch(api);

    if (!r.ok) throw new Error('Tidak bisa terhubung ke Pinterest');

    const j = await r.json();
    
    if (!j.contents) throw new Error('Halaman tidak ditemukan atau dibatasi');

    const html = j.contents;

    // Cari link video — urutan prioritas
    let video = 
      (html.match(/"V_720P":\s*\{"url":"([^"]+)"/) || [])[1] ||
      (html.match(/"V_480P":\s*\{"url":"([^"]+)"/) || [])[1] ||
      (html.match(/https:\/\/v1\.pinimg\.com\/videos\/[^"&]+\.mp4/) || [])[0];

    if (video) {
      video = video.replace(/\\u002F/g, '/');
      resDiv.innerHTML = `
        <span class="status-sukses">✅ VIDEO KETEMU!</span><br><br>
        <a href="${video}" target="_blank" rel="noopener">
          <button class="btn" style="margin:0">⬇️ DOWNLOAD VIDEO MP4</button>
        </a>
      `;
      btn.innerText = 'BERHASIL ✅';
      return;
    }

    // Cari gambar HD
    let img = (html.match(/"orig":\s*\{"url":"([^"]+)"/) || [])[1];

    if (img) {
      img = img.replace(/\\u002F/g, '/');
      resDiv.innerHTML = `
        <span class="status-sukses">✅ GAMBAR HD KETEMU!</span><br><br>
        <img src="${img}" alt="Pinterest Image" style="width:100%;margin:10px 0;border:1px solid #222"><br>
        <a href="${img}" target="_blank" rel="noopener">
          <button class="btn" style="margin:0">⬇️ DOWNLOAD GAMBAR</button>
        </a>
      `;
      btn.innerText = 'BERHASIL ✅';
      return;
    }

    // Kalau tidak ketemu keduanya
    throw new Error('Tidak ditemukan video/gambar di link ini. Coba link pin lain ya!');

  } catch (e) {
    resDiv.innerHTML = `<span class="status-error">❌ GAGAL: ${e.message}</span>`;
    btn.innerText = 'MULAI DOWNLOAD';
  } finally {
    btn.disabled = false;
  }
}

// Bisa tekan Enter langsung
document.getElementById('url').addEventListener('keydown', e => {
  if (e.key === 'Enter') downloadReal();
});
</script>
</body>
</html>
